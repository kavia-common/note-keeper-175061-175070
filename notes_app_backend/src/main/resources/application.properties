spring.application.name=notesappbackend

# Fixed server port for previews and local dev
server.port=3001

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# H2 Database Configuration (in-memory for dev/tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration (dev)
# Remove explicit Hibernate dialect for H2 to avoid extra resolution work; Boot will auto-detect for H2.
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Keep SQL printing off for faster/cleaner startup
spring.jpa.show-sql=false

# Logging: reduce noise for faster startup and smaller logs
# Set concise root level (prefer warn to minimize noise)
logging.level.root=warn
# Silence Hibernate SQL and binding logs
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off
# Keep Spring web/autoconfigure informative but minimal
logging.level.org.springframework.web=info
logging.level.org.springframework.boot.autoconfigure=info

# DevTools: ensure no runtime property augmentation and no restarts in CI
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false

# Open Session in View awareness:
# Spring Boot defaults open-in-view to true for JPA which can mask LazyInitializationException by keeping
# the session open for the web layer. Consider disabling in production to surface incorrect lazy access patterns.
# spring.jpa.open-in-view=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=none
springdoc.api-docs.enabled=true
springdoc.packagesToScan=com.example.notesappbackend
springdoc.pathsToMatch=/**

# ---------------------------------------------------------------------------
# Production profile hints (uncomment/adjust under prod profile)
# ---------------------------------------------------------------------------
# In src/main/resources/application-prod.properties (recommended):
# spring.jpa.hibernate.ddl-auto=validate
# spring.h2.console.enabled=false
# spring.jpa.show-sql=false
# logging.level.root=info
# server.port=${PORT:8080}
#
# Or activate via:
# spring.profiles.active=prod
