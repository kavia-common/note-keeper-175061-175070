spring.application.name=notesappbackend

# Fixed server port for previews and local dev
server.port=3001

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# H2 Database Configuration (in-memory for dev/tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration (dev)
# Ensure no explicit dialect is set; Boot will auto-detect for H2.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging: reduce noise for faster startup and smaller logs
# Use INFO as requested and explicitly disable verbose Hibernate logs
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# DevTools: ensure no runtime property augmentation and no restarts/LiveReload in CI
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=none
springdoc.api-docs.enabled=true
springdoc.packagesToScan=com.example.notesappbackend
springdoc.pathsToMatch=/**

# ---------------------------------------------------------------------------
# Production profile hints (uncomment/adjust under prod profile)
# ---------------------------------------------------------------------------
# In src/main/resources/application-prod.properties (recommended):
# spring.jpa.hibernate.ddl-auto=validate
# spring.h2.console.enabled=false
# spring.jpa.show-sql=false
# logging.level.root=info
# server.port=${PORT:8080}
#
# Or activate via:
# spring.profiles.active=prod
