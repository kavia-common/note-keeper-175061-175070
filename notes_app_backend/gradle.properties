# Gradle performance optimizations for CI and local builds

# Enable Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable configuration cache to speed up configuration phase
org.gradle.configuration-cache=true

# Constrain logging for cleaner CI output
org.gradle.warning.mode=all

# Reasonable defaults for parallel execution in CI
org.gradle.parallel=true
org.gradle.workers.max=2

# Reduce memory overhead for the Gradle JVM in constrained environments
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8
