plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
}

group = 'com.example'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Include bean validation API and provider to avoid jakarta.validation NoProviderFoundException
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.hibernate.validator:hibernate-validator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    // Devtools is for local development; restarts are disabled in application.properties for CI
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

checkstyle {
    // Use a stable Checkstyle version compatible with Gradle 8.x
    toolVersion = '10.12.5'
    configFile = file('config/checkstyle/checkstyle.xml')
    showViolations = true
    // Do not fail the build on violations in CI linter step for now
    ignoreFailures = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    // Ensure checkstyle runs with the check lifecycle
    dependsOn 'checkstyleMain', 'checkstyleTest'
}

tasks.named('test') {
    useJUnitPlatform()
}
